version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"
    labels:
      - "dependencies"
    groups:
      # All non-major dev dependency bumps collapse into a single PR.
      npm-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # All non-major production dependency bumps collapse into a single PR.
      # (Previously patch-only, which left minor prod bumps as separate PRs.)
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    target-branch: "develop"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # All GitHub Actions bumps collapse into a single PR.
      github-actions:
        patterns:
          - "*"
